# Builds the Cloud Run image (Dockerfile.cloudrun).
#
# NEXT_PUBLIC_* have to be build args, not runtime env: Next.js inlines them
# into the client bundle at compile time, so setting them on the Cloud Run
# service afterwards would have no effect on the already-built frontend.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - --build-arg
      - NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}
      - --build-arg
      - NEXT_PUBLIC_BILLING_CURRENCY=INR
      - --build-arg
      - NEXT_PUBLIC_VERSION=${_TAG}
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/hookstep-prod/hookpost/app
  _TAG: v1
  _BACKEND_URL: https://hookpost.hookstep.in/api

options:
  # E2_HIGHCPU_8 is quota-blocked in asia-southeast1, so this uses the default
  # worker. The Next.js build sets --max-old-space-size=4096 to fit it.
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
