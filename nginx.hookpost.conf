# A Next.js Server Action id is a long hex string. Next 16 raises an unhandled
# error on a malformed one, which takes down the whole frontend process - and
# internet background scanners POST / with junk headers, crash-looping it
# (45+ restarts observed). This app registers no Server Actions at all
# (server-reference-manifest.json is empty), so a Next-Action header is never
# legitimate here; well-formed hex is still allowed in case actions are added.
map $http_next_action $bad_next_action {
    default              1;
    ""                   0;
    "~^[0-9a-fA-F]{8,}$" 0;
}

proxy_cache_path /var/cache/nginx/hookpost_cache levels=1:2 keys_zone=HOOKPOST_SSR:20m max_size=500m inactive=60m use_temp_path=off;

server {
    server_name hookpost.hookstep.in;

    # Reject malformed Server Action headers before they reach Next.js.
    if ($bad_next_action) { return 400; }
    location = /56f6b8bac4c0a3c46b398c49b660fb4e.txt { return 200 "56f6b8bac4c0a3c46b398c49b660fb4e"; add_header Content-Type text/plain; }
    location = /249826f42a6c4da1bb062a4f6645391d.txt { return 200 "249826f42a6c4da1bb062a4f6645391d"; add_header Content-Type text/plain; }

    # Legacy & Crawler 301 Redirects
    location = /privacy-policy { return 301 /privacy; }
    location = /alternatives/postiz/public-api { return 301 /docs/public-api; }
    location ^~ /cdn-cgi/l/email-protection { return 301 /contact; }

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # High-Performance Kernel File & Network I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Open File Descriptor Cache
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip Dynamic Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Next.js Static Cache (Immutable 1 Year)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4200/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # User uploads (avatars & media) from persistent local storage
    location ^~ /uploads/ {
        alias /home/flexiple_jr/hookpost-uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Public static media & images - Zero-copy direct disk delivery with Next.js fallback
    # Public static media & images - Zero-copy direct disk delivery with Next.js fallback
    #
    # NOT immutable. These filenames never change, so "immutable" told every
    # browser to keep its copy for 30 days without ever revalidating - and when
    # brand-logo.png was replaced, everyone who had already loaded the old mark
    # kept seeing it for a month with no way to refresh short of clearing site
    # data. immutable is only ever correct on content-hashed names, which is why
    # /_next/static/ above keeps it and this block must not.
    #
    # A day of caching with revalidation costs one conditional request that
    # almost always answers 304 against the existing ETag, and an asset swap
    # reaches people the next day instead of the next month.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|txt|xml)$ {
        root /home/flexiple_jr/hookpost/apps/frontend/public;
        try_files $uri @nextjs;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend API (Live - real-time operations)
    location /.well-known/ {
        root /home/flexiple_jr/hookpost/apps/frontend/public;
        try_files $uri =404;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Next.js app & landing page
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bypass cache for authenticated users and dynamic app/auth routes
        set $skip_cache 0;
        if ($http_cookie ~* "auth") {
            set $skip_cache 1;
        }
        if ($http_authorization) {
            set $skip_cache 1;
        }
        if ($request_uri ~* "^/(auth|launches|analytics|settings|billing|media|admin|plugs|agents|third-party)") {
            set $skip_cache 1;
        }

        # Proxy Caching (Static landing/SEO pages only, never cache 302 redirects)
        proxy_cache HOOKPOST_SSR;
        proxy_cache_bypass $skip_cache $http_upgrade;
        proxy_no_cache $skip_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    listen 443 ssl http2;
    http2_max_concurrent_streams 512;
    ssl_certificate /etc/letsencrypt/live/hookpost.hookstep.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hookpost.hookstep.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name hookpost.hookstep.in;
    location = /56f6b8bac4c0a3c46b398c49b660fb4e.txt { return 200 "56f6b8bac4c0a3c46b398c49b660fb4e"; add_header Content-Type text/plain; }
    location = /249826f42a6c4da1bb062a4f6645391d.txt { return 200 "249826f42a6c4da1bb062a4f6645391d"; add_header Content-Type text/plain; }
    return 301 https://$host$request_uri;
}
