# A Next.js Server Action id is a long hex string. Next 16 raises an unhandled
# error on a malformed one, which takes down the whole frontend process - and
# internet background scanners POST / with junk headers, which crash-looped it
# roughly once a minute in production. This app registers no Server Actions at
# all (server-reference-manifest.json is empty), so a Next-Action header is
# never legitimate here; well-formed hex still passes in case actions are added.
map $http_next_action $bad_next_action {
    default              1;
    ""                   0;
    "~^[0-9a-fA-F]{8,}$" 0;
}

server {
    listen 80;
    server_name hookpost.hookstep.in;

    # Reject malformed Server Action headers before they reach Next.js.
    if ($bad_next_action) { return 400; }

    client_max_body_size 100M;

    # User uploads (channel avatars & post media) — local storage provider writes
    # to UPLOAD_DIRECTORY and serves them at FRONTEND_URL + /uploads. Must be a
    # persistent dir (NOT /tmp) and served here, or every avatar/upload 404s.
    location ^~ /uploads/ {
        alias /home/flexiple_jr/hookpost-uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend Next.js app & landing page
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
